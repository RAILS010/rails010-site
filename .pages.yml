# Tells Pages CMS (app.pagescms.org) which parts of the RAILS site are editable.
media:
  input: assets/uploads
  output: /assets/uploads
content:
  - name: site
    label: Website text
    type: file
    path: _data/content.yml
    fields:
      - name: announcement
        label: Announcement banner
        type: object
        description: A pink strip at the very top of the page. Switch it on for things like "First event on 15 October!"
        fields:
          - name: show
            label: Show the banner
            type: boolean
          - name: text
            label: Banner text
            type: string
          - name: link
            label: Banner link (optional)
            type: string
            description: "Where clicking the banner goes. Use #events to jump to the events section, or paste a full https:// link."

      - name: hero
        label: Top of the page
        type: object
        fields:
          - name: full_name
            label: Full name (small heading)
            type: string
          - name: tagline
            label: Big tagline
            type: string
            description: Keep it short, roughly 6 to 10 words. Longer text will push the animation down.
          - name: intro
            label: Intro text
            type: text
          - name: primary_button
            label: Pink button text (goes to events)
            type: string
          - name: secondary_button
            label: White button text (goes to Get involved)
            type: string

      - name: why
        label: Why we exist
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: paragraphs
            label: Paragraphs
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "Paragraph {index}"
            fields:
              - name: text
                label: Text
                type: text
          - name: audiences
            label: Who it's for (list with flowers)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
              - name: text
                label: Text
                type: text

      - name: what_we_do
        label: What we do
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro line
            type: text
          - name: formats
            label: Event formats (coloured boxes)
            type: object
            description: Colours rotate pink, white, light blue in order. Three boxes fit best in one row.
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
              - name: text
                label: Text
                type: text
              - name: coming_soon
                label: Show "Coming soon" sticker
                type: boolean

      - name: events
        label: Events section
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: intro
            label: Intro text
            type: text
          - name: luma_embed_url
            label: Luma calendar embed link
            type: string
            description: "In Luma, open your calendar (or a single event), choose Share, then Embed, and paste the code here. The whole <iframe> code is fine. Your profile link (luma.com/user/...) can NOT be embedded."
          - name: empty_message
            label: Text shown when there's no Luma calendar yet
            type: string
          - name: follow_button
            label: Luma button text
            type: string
          - name: past_button
            label: Past events button text
            type: string

      - name: get_involved
        label: Get involved
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: paths
            label: Ways to get involved
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
              - name: text
                label: Text
                type: text
              - name: button_label
                label: Button text
                type: string
              - name: button_link
                label: Button link
                type: string
                description: "#events jumps to a section; mailto:hello@rails010.nl opens an email; or paste a full https:// link."
              - name: button_colour
                label: Button colour
                type: select
                options:
                  values: [pink, white, blue]

      - name: contact
        label: Contact
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: email
            label: Email address
            type: string
          - name: instagram_handle
            label: Instagram handle (without @)
            type: string
          - name: luma_url
            label: Luma profile link
            type: string

      - name: footer_text
        label: Footer text
        type: string

      - name: seo_description
        label: Google description
        type: text
        description: The short summary Google and link previews show under the site's name. About 150 characters.

  - name: past_events
    label: Past events
    type: file
    path: _data/past_events.yml
    fields:
      - name: heading
        label: Page heading
        type: string
      - name: intro
        label: Intro text
        type: text
      - name: events
        label: Events
        type: object
        description: Newest event at the top. Drag to reorder.
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
          - name: format
            label: Type of event (small label)
            type: string
            description: For example "Debate night", "Workshop", "Speaker".
          - name: date
            label: Date
            type: date
          - name: location
            label: Location
            type: string
          - name: partners
            label: Organised with (optional)
            type: string
          - name: supported_by
            label: Supported by (optional)
            type: string
            description: Funders or sponsors, e.g. BlueDot Impact.
          - name: poster
            label: Poster
            type: image
          - name: poster_alt
            label: Poster description (for screen readers)
            type: text
            description: What the poster says and shows, in one or two sentences.
          - name: description
            label: What happened
            type: text
            description: Three to five sentences. You can make links like [this](https://example.com).
          - name: photos
            label: Photos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                label: Photo
                type: image
              - name: alt
                label: Photo description (for screen readers)
                type: text
              - name: caption
                label: Caption (optional, shown under the photo)
                type: string
          - name: links
            label: Links (optional)
            type: object
            description: Slides, a recap post, recordings...
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Button text
                type: string
              - name: url
                label: Link
                type: string
      - name: cta_text
        label: Text at the bottom of the page
        type: string
      - name: cta_button
        label: Button text at the bottom
        type: string

  - name: majors
    label: Your major (train page)
    type: file
    path: _data/majors.yml
    fields:
      - name: heading
        label: Page heading
        type: string
      - name: intro
        label: Intro text
        type: text
      - name: hint
        label: Hint above the train
        type: string
      - name: eur_label
        label: Station sign before the Erasmus majors
        type: string
      - name: elsewhere_label
        label: Station sign before the other majors
        type: string
      - name: event_button
        label: Button on every ticket (goes to events)
        type: string
      - name: tip
        label: Small note at the bottom of every ticket
        type: text
      - name: cars
        label: Carriages
        type: object
        description: One carriage per major, in train order. Keep "All majors" first, then the Erasmus majors, then the others. Renaming a carriage changes its link.
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name on the carriage
            type: string
            description: Short, about 25 characters max, so it fits on two lines.
          - name: group
            label: Group
            type: select
            options:
              values: [all, eur, elsewhere]
            description: "all = the first carriage, eur = taught at Erasmus, elsewhere = not taught at Erasmus"
          - name: programmes
            label: '"Valid for" line (which programmes count)'
            type: string
          - name: why
            label: Why your major matters
            type: text
          - name: roles
            label: Where you could fit
            type: string
            list: true
          - name: resources
            label: First stops (resources)
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Name
                type: string
              - name: url
                label: Link
                type: string
              - name: note
                label: One-line description
                type: string
