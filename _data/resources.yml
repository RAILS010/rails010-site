  - title: Get funding
    intro: Have an idea for an event or project, or want to work on AI safety
      full-time? Apply for a grant.
    items:
      - name: Rapid Grants
        url: https://bluedot.org/grants/rapid
        text: For events and projects. Decisions take about 5 days on average.
        tag: Up to $20k
        hide_after: 2026-11-03
      - name: Career Transition Grants
        url: https://bluedot.org/grants/career-transition
        text: Funding to go full-time on AI safety.
        tag: Up to $200k
        hide_after: 2026-11-03
      - name: Seed Grants
        url: https://bluedot.org/grants/seed
        text: Funding to found a new organisation.
        tag: $20k – $200k
        hide_after: 2026-11-03
  - title: Programmes and fellowships
    intro: More free opportunities to research, learn and write.
    items:
      - name: SPAR
        url: https://sparai.org/
        text: Get paired up with a mentor to research AI risks.
        tag: Research mentorship
        hide_after: 2028-12-03
      - name: Global Challenges Project
        url: https://www.globalchallengesproject.org/
        text: Residential workshops on the risks from advanced AI and what to do about
          them. Travel and accommodation are funded.
        tag: Workshops
        hide_after: 2028-12-03
      - name: SIRA Project
        url: https://sira-project.org/
        text: Summer research fellowship for social scientists, from undergrad to
          postdoc.
        tag: Summer fellowship
        hide_after: 2027-03-07
      - name: Transformative AI essay contest
        url: https://substack.com/inbox/post/222655205
        text: Write about how transformative AI will affect low- and middle-income
          countries.
        tag: $10,000 prize
        hide_after: 2026-12-31
  - title: Find events, programmes and jobs
    items:
      - name: AISafety.com
        url: https://aisafety.com/
        text: Events, training programmes and job opportunities in one place.
        tag: Directory
