heading: Resources
intro: Free courses, funding, and opportunities for getting into AI safety.
featured:
  show: true
  label: At Erasmus University Rotterdam
  title: "Frontier AI Governance Fellowship "
  text: Weekly readings and discussions with our facilitators, from the week of 16
    November to the week of 14 December. You get a certificate when you finish.
  when: Weekly · 16 Nov – 14 Dec
  button_label: Sign up
  url: https://airtable.com/appjNAd8YnAmA37ki/pagOIeUqjOJo6LyFb/form
  hide_after: 2026-11-16
