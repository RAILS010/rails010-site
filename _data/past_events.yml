heading: Past events
intro: "What we've been up to. "
events:
  - title: Should we pause frontier AI development?
    format: Debate night
    date: 2026-10-15
    location: Langeveld 1.02, Erasmus University Rotterdam
    partners: Erasmus Debating Society
    supported_by: BlueDot Impact
    poster: /assets/uploads/2026-10-15-debate-night-poster.jpg
    poster_alt: "Event poster: Should we pause frontier AI development? A stop sign
      between YES and NO placards. 18:30, 15 October 2026, Langeveld 1.02. Join
      the debate evening to win a NYT best-seller. No background required."
    description: >-
      Students debated in British Parliamentary style on the motion “Should we
      pause frontier AI development?” Topics discussed included the
      concentration of power, whether a pause is feasible, and what it would
      include.


      The top four speakers received copies of Human Compatible,
      Superintelligence, and If Anyone Builds It, Everyone Dies (one of the
      final copies on Bol!).
    photos:
      - image: /assets/uploads/2026-10-15-debate-night-winners.jpg
        alt: The organisers and four debate winners at the front of the lecture room,
          holding their prize books and Erasmus tote bags. Some faces are
          covered with blue hearts.
        caption: Our winners with their prize books.
